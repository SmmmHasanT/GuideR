name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.11.1
      - name: Build
        run: |
          set -o pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleRelease 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -60 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build failed::$msg"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk GuideR-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GuideR-apk
          path: GuideR-*.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GuideR 1.0.${{ github.run_number }}
          files: GuideR-*.apk
